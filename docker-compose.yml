# MASJIDOASIS — Local Development Compose
#
# MAS-17: Provides Postgres 16 + Redis 7 for local dev. The Next.js app
# itself normally runs on the host via `npm run dev` (matches ADR-001
# self-hosted deploy: pm2/systemd + Nginx in production). For a fully
# containerized dev loop, enable the `full` profile to also run the app:
#
#   docker compose up -d                       # postgres + redis only
#   docker compose --profile full up -d        # + app container
#   docker compose down                        # stop all
#   docker compose down -v                     # + wipe volumes (DESTRUCTIVE)
#
# Connection strings for host-side `npm run dev` (.env):
#   DATABASE_URL=postgresql://masjidoasis:masjidoasis@localhost:5432/masjidoasis?schema=public
#   REDIS_URL=redis://localhost:6379
#   BULLMQ_REDIS_URL=redis://localhost:6379
#
# Connection strings for the containerized app (inside `full` profile):
#   DATABASE_URL=postgresql://masjidoasis:masjidoasis@postgres:5432/masjidoasis?schema=public
#   REDIS_URL=redis://redis:6379
#
# NEVER use these credentials in production. They're dev-only defaults.

name: masjidoasis

services:
  postgres:
    image: postgres:16-alpine
    container_name: masjidoasis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: masjidoasis
      POSTGRES_PASSWORD: masjidoasis
      POSTGRES_DB: masjidoasis
      # Use trust auth for local dev convenience; password still set for compatibility.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masjidoasis -d masjidoasis"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: masjidoasis-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Optional: fully containerized Next.js app. Enable with `--profile full`.
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: masjidoasis-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://masjidoasis:masjidoasis@postgres:5432/masjidoasis?schema=public
      REDIS_URL: redis://redis:6379
      BULLMQ_REDIS_URL: redis://redis:6379
      # The boot validator (scripts/check-env.mjs) needs these. Real values
      # belong in a host-side .env, NEVER committed.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-only-secret-do-not-use-in-prod-xxxxxxxxxxxxxxxx}
      NEXTAUTH_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-do-not-use-in-prod-xxxxxxxxxxxxxxxx}
      OTP_PROVIDER: ${OTP_PROVIDER:-fonnte}
      OTP_API_KEY: ${OTP_API_KEY:-dev-placeholder}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]

volumes:
  postgres_data:
    name: masjidoasis_postgres_data
  redis_data:
    name: masjidoasis_redis_data
